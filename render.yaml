# Render blueprint. Set the values marked sync:false in the dashboard —
# never commit real secrets to this file.
services:
  - type: web
    name: findthem-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://findthemindia.vercel.app
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: findthem-face
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -t 120 -b 0.0.0.0:$PORT face_server:app
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://findthemindia.vercel.app
